name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --maxWorkers=2
      - name: Typecheck and build app and offline demo
        run: npm run build:demo
      - name: Check for exposed credentials and private build artifacts
        run: npm run check:exposure
      - name: Check Cloudflare Pages routing
        run: npm run test:pages-routing
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check fictional hosted workflow
        run: npm run test:hosted-browser
      - name: Check student-only analytics scope
        run: npm run test:analytics-browser
      - name: Check admin access workflow
        run: npm run test:admin-browser
      - name: Check import, offline reader and printing
        shell: bash
        run: |
          npm run preview -- --port 4174 --strictPort > /tmp/script-reader-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/import > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/script-reader-preview.log
            exit 1
          fi
          npm run test:browser
